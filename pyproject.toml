[project]
name = "ai_munimji"
authors = [
    { name = "AI Munimji project", email = "vivek.vpc1985@gmail.com"}
]
description = "Watches stock and prepares draft purchase orders for approval"
license = { text = "GPL-3.0-or-later" }  # the same as app_license in hooks.py and the README; the text is in LICENSE
classifiers = ["License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)"]
requires-python = ">=3.14"
readme = "README.md"
dynamic = ["version"]
dependencies = [
    # "frappe~=16.0.0" # Installed and managed by bench.
    # The rule logic (stock analysis, vendor scoring, the settings models), pinned to the exact version this release was made and tested with. The installer finds it on PyPI; to try an
    # engine that is not published yet, dev/install-engine.sh puts a local wheel into the bench first (README, "The engine"). This is the only line to change when the way of getting it changes.
    "ai-munimji-engine==0.1.1",
]

[build-system]
requires = ["flit_core >=3.4,<4"]
build-backend = "flit_core.buildapi"

# Frappe Cloud makes this section mandatory (docs.frappe.io, Cloud, "Versioning", updated 2026-08-05); Frappe's own app template does not write it.
# The lower bounds are the oldest versions this app's CI has actually run on: Frappe 16.55.2 and ERPNext 16.54.0, in every one of the 12 CI runs that reached the version line (6 and 9 Nov 2026), which
# are also the newest stable v16 tags (frappe/frappe and frappe/erpnext on GitHub, read 9 Nov 2026). Do not lower them without running the CI on the older version; the range is not widened beyond what was run.
[tool.bench.frappe-dependencies]
frappe = ">=16.55.2,<17.0.0"
erpnext = ">=16.54.0,<17.0.0"

# These dependencies are only installed when developer mode is enabled
[tool.bench.dev-dependencies]
# package_name = "~=1.1.0"

# System packages for Frappe Cloud (the older [deploy.dependencies.apt] table, which the template still writes, is also read). None needed.
[tool.frappe-cloud]
apt-dependencies = []

[tool.ruff]
line-length = 110
target-version = "py314"

[tool.ruff.lint]
select = [
    "F",
    "E",
    "W",
    "I",
    "UP",
    "B",
    "RUF",
]
ignore = [
    "B017", # assertRaises(Exception) - should be more specific
    "B018", # useless expression, not assigned to anything
    "B023", # function doesn't bind loop variable - will have last iteration's value
    "B904", # raise inside except without from
    "E101", # indentation contains mixed spaces and tabs
    "E402", # module level import not at top of file
    "E501", # line too long
    "E741", # ambiguous variable name
    "F401", # "unused" imports
    "F403", # can't detect undefined names from * import
    "F405", # can't detect undefined names from * import
    "F722", # syntax error in forward type annotation
    "W191", # indentation contains tabs
    "UP030", # Use implicit references for positional format fields (translations)
    "UP031", # Use format specifiers instead of percent format
    "UP032", # Use f-string instead of `format` call (translations)
    "UP037", # quoted annotations
    "UP040", # Use type aliases instead of type annotations
]
typing-modules = ["frappe.types.DF"]

[tool.ruff.lint.per-file-ignores]
"dev/scripts/*" = ["F821"]  # run by dev/frappe_run.py, which hands them `frappe` and `args` as globals

[tool.ruff.format]
quote-style = "double"
indent-style = "tab"
docstring-code-format = true
