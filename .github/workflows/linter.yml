name: Linters

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linter:
    name: 'Frappe Linter'
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'

    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'
          cache: pip
      - uses: pre-commit/action@v3.0.0

      - name: Download Semgrep rules
        run: git clone --depth 1 https://github.com/frappe/semgrep-rules.git frappe-semgrep-rules

      - name: Run Semgrep rules
        run: |
          pip install semgrep
          semgrep ci --config ./frappe-semgrep-rules/rules --config r/python.lang.correctness

  deps-vulnerable-check:
    name: 'Vulnerable Dependency Check and bandit'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'

      - uses: actions/checkout@v6

      - name: Build the engine wheel
        id: engine
        uses: ./.github/actions/engine-wheel

      - name: Cache pip
        uses: actions/cache@v5
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/*requirements.txt', '**/pyproject.toml', '**/setup.py') }}
          restore-keys: |
            ${{ runner.os }}-pip-
            ${{ runner.os }}-

      # Not "pip-audit .": the project's one dependency is the engine, which is not on PyPI, so the audit cannot resolve it. What the app adds to a bench is the engine and what the
      # engine needs, so that installed set is audited. Frappe's and ERPNext's own pins are not this app's to fix and are not audited here.
      - name: Install the engine and audit it with what it needs
        run: |
          python -m venv "$RUNNER_TEMP/audit-env"
          "$RUNNER_TEMP/audit-env/bin/python" -m pip install --disable-pip-version-check --quiet "${{ steps.engine.outputs.wheel }}"
          "$RUNNER_TEMP/audit-env/bin/python" dev/scripts/engine_requirements.py | tee "$RUNNER_TEMP/engine-requirements.txt"
          pip install pip-audit
          pip-audit --desc on --no-deps --disable-pip -r "$RUNNER_TEMP/engine-requirements.txt"

      - name: bandit (any finding fails the build)
        run: |
          pip install bandit
          bandit -r ai_munimji -q -x ai_munimji/tests,ai_munimji/ai_munimji/doctype/munimji_approval_request/test_munimji_approval_request.py,ai_munimji/public
